  <script>
    const TRACKS = [
      { title: "RYPER Test Track One", artist: "RYPER Fixture" },
      { title: "RYPER Test Track Two", artist: "RYPER Fixture" },
      { title: "RYPER Test Track Three", artist: "RYPER Fixture" },
    ];
    let trackIndex = 0;
    const audio = document.getElementById("a");
    const statusEl = document.getElementById("status");

    function setMetadata() {
      const track = TRACKS[trackIndex];
      if ("mediaSession" in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: track.title,
          artist: track.artist,
          album: "RYPER Phase 13.15",
        });
      }
      statusEl.textContent =
        "track=" + track.title + " playbackState=" + (navigator.mediaSession ? navigator.mediaSession.playbackState : "n/a");
    }

    function setPlaybackState(state) {
      if ("mediaSession" in navigator) navigator.mediaSession.playbackState = state;
      statusEl.textContent = "track=" + TRACKS[trackIndex].title + " playbackState=" + state;
    }

    if ("mediaSession" in navigator) {
      navigator.mediaSession.setActionHandler("play", () => {
        audio.play();
        setPlaybackState("playing");
      });
      navigator.mediaSession.setActionHandler("pause", () => {
        audio.pause();
        setPlaybackState("paused");
      });
      navigator.mediaSession.setActionHandler("nexttrack", () => {
        trackIndex = (trackIndex + 1) % TRACKS.length;
        setMetadata();
      });
      navigator.mediaSession.setActionHandler("previoustrack", () => {
        trackIndex = (trackIndex - 1 + TRACKS.length) % TRACKS.length;
        setMetadata();
      });
    }

    audio.addEventListener("play", () => setPlaybackState("playing"));
    audio.addEventListener("pause", () => setPlaybackState("paused"));

    setMetadata();
    audio.play().then(() => setPlaybackState("playing")).catch((err) => {
      statusEl.textContent = "autoplay blocked: " + err;
    });
  </script>
