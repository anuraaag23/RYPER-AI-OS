name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-linux:
    name: Linux (Ubuntu) - Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check and compile monorepo
        run: npm run build

      - name: Build desktop application bundle
        run: npm run build --workspace=@ryper/desktop-app

      - name: Run automated tests
        run: npm test

  test-windows:
    name: Windows - Build & Test
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check and compile monorepo
        run: npm run build

      - name: Build desktop application bundle
        run: npm run build --workspace=@ryper/desktop-app

      - name: Isolate runner environment from host browser
        shell: pwsh
        run: |
          Get-Process -Name msedge*, MicrosoftEdge* -ErrorAction SilentlyContinue | Stop-Process -Force
          $paths = @(
            "C:\Program Files\Microsoft\Edge\Application\msedge.exe",
            "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe"
          )
          foreach ($p in $paths) {
            if (Test-Path $p) {
              Rename-Item -Path $p -NewName "msedge.exe.ci-isolated" -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Run automated tests
        run: npm test

      - name: Restore host browser
        if: always()
        shell: pwsh
        run: |
          $paths = @(
            "C:\Program Files\Microsoft\Edge\Application\msedge.exe.ci-isolated",
            "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe.ci-isolated"
          )
          foreach ($p in $paths) {
            if (Test-Path $p) {
              Rename-Item -Path $p -NewName "msedge.exe" -Force -ErrorAction SilentlyContinue
            }
          }
