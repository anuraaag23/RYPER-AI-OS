name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Full verification (format, lint, build, test)
        run: npm run ci

      # Native shell packaging (MSIX / notarized .app / AppImage / Play Store
      # bundle / App Store build) is intentionally not run here: it requires
      # OS-specific runners and signing credentials configured per platform.
      # Each platform/* shell owns its own packaging job once that shell's
      # native toolchain lands — see platform/*/README.md.

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: true
